<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频处理集群管理</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e6e9ef;
    --dim: #99a1b3; --accent: #4a9eff; --ok: #3ecf8e; --warn: #f5a623; --bad: #ff5c5c;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f6f8; --panel:#fff; --line:#e2e5ea; --text:#1b1f27; --dim:#68707f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  header { padding:18px 24px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  h1 { font-size:17px; margin:0; font-weight:600; }
  .sub { color:var(--dim); font-size:13px; }
  main { padding:20px 24px; max-width:1400px; }
  section { margin-bottom:26px; }
  h2 { font-size:14px; margin:0 0 12px; font-weight:600; color:var(--dim);
    text-transform:uppercase; letter-spacing:.06em; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .name { font-weight:600; font-size:15px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:20px; border:1px solid var(--line); }
  .b-ok { color:var(--ok); border-color:var(--ok); }
  .b-bad { color:var(--bad); border-color:var(--bad); }
  .b-master { color:var(--accent); border-color:var(--accent); }
  .kv { display:flex; justify-content:space-between; font-size:13px; padding:3px 0; color:var(--dim); }
  .kv b { color:var(--text); font-weight:500; }
  .bar { height:5px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:3px; }
  .bar i { display:block; height:100%; background:var(--accent); }
  form { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .row { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); margin-bottom:12px; }
  label { display:block; font-size:12px; color:var(--dim); margin-bottom:5px; }
  input, select { width:100%; padding:8px 10px; background:var(--bg); color:var(--text);
    border:1px solid var(--line); border-radius:6px; font-size:13px; font-family:inherit; }
  button { padding:9px 18px; border-radius:6px; border:1px solid var(--accent);
    background:var(--accent); color:#fff; font-size:13px; cursor:pointer; font-family:inherit; }
  button.ghost { background:transparent; color:var(--dim); border-color:var(--line); }
  button:hover { opacity:.88; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; font-size:12px; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size:12px; }
  .pods { display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; }
  .pod { font-size:11px; padding:2px 7px; border-radius:4px; background:var(--bg);
    border:1px solid var(--line); color:var(--dim); }
  .pod.run { color:var(--accent); border-color:var(--accent); }
  .pod.done { color:var(--ok); border-color:var(--ok); }
  .pod.fail { color:var(--bad); border-color:var(--bad); }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px;
    overflow:auto; max-height:340px; font-size:12px; line-height:1.5; margin:0; }
  .empty { color:var(--dim); font-size:13px; padding:14px; text-align:center; }
  .msg { padding:10px 14px; border-radius:8px; margin-bottom:12px; font-size:13px; display:none; }
  .msg.ok { display:block; background:rgba(62,207,142,.12); color:var(--ok); }
  .msg.err { display:block; background:rgba(255,92,92,.12); color:var(--bad); }
  @media (max-width:640px){ main{padding:14px;} header{padding:14px;} }
</style>
</head>
<body>
<header>
  <h1>视频处理集群</h1>
  <span class="sub" id="summary">加载中…</span>
  <span class="sub" id="storage"></span>
  <span style="flex:1"></span>
  <button class="ghost" onclick="refreshAll()">刷新</button>
</header>

<main>
  <section>
    <h2>节点</h2>
    <div class="grid" id="nodes"></div>
  </section>

  <section>
    <h2>提交任务</h2>
    <div class="msg" id="msg"></div>
    <form onsubmit="submitJob(event)">
      <div class="row">
        <div>
          <label>处理模式</label>
          <select id="mode" onchange="toggleMode()">
            <option value="local">就近处理（各节点读写本地盘，零网络 IO）</option>
            <option value="shared">共享存储（读写 NFS，需填路径）</option>
          </select>
        </div>
      </div>
      <div class="row" id="sharedFields" style="display:none">
        <div>
          <label>输入目录（容器内路径）</label>
          <input id="input" value="/data/input">
        </div>
        <div>
          <label>输出目录（容器内路径）</label>
          <input id="output" value="/data/output">
        </div>
        <div>
          <label>分片数（留空 = 节点数）</label>
          <input id="shards" type="number" min="1" max="64" placeholder="自动">
        </div>
      </div>
      <div class="row" id="localHint">
        <div style="grid-column:1/-1; color:var(--dim); font-size:12px; line-height:1.6">
          就近模式下每个节点只处理自己本地
          <code class="mono">/mnt/hd/Project/local_data/input</code> 里的素材，
          产出写到同机的 <code class="mono">output</code>，全程不走网络。
          先用 <code class="mono">dispatch.py scatter</code> 分发素材，
          处理完用 <code class="mono">dispatch.py gather</code> 导出。
        </div>
      </div>
      <div class="row">
        <div style="grid-column:1/-1">
          <label>处理参数</label>
          <input id="options" class="mono"
                 value="--encoder nvenc --cq 23 --jobs 8 --min-clip 15 --skip-processed">
        </div>
      </div>
      <button type="submit">下发任务</button>
    </form>
  </section>

  <section>
    <h2>任务</h2>
    <div id="jobs"></div>
  </section>

  <section id="logsec" style="display:none">
    <h2>日志 · <span id="logname" class="mono"></span></h2>
    <pre id="logs">加载中…</pre>
  </section>
</main>

<script>
let currentLog = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  return r.json();
}

function pct(v) { return Math.max(0, Math.min(100, parseFloat(v) || 0)); }

async function loadNodes() {
  const d = await api('/api/nodes');
  const box = document.getElementById('nodes');
  if (d.error) { box.innerHTML = `<div class="empty">读取节点失败：${d.error}</div>`; return; }
  const ns = d.nodes || [];
  const ready = ns.filter(n => n.ready).length;
  const cpu = ns.reduce((s, n) => s + n.cpu, 0);
  const gpu = ns.reduce((s, n) => s + (parseInt(n.gpu_count) || 0), 0);
  document.getElementById('summary').textContent =
    `${ready}/${ns.length} 节点就绪 · ${cpu} 核 · ${gpu} 张 GPU`;

  box.innerHTML = ns.map(n => {
    const cu = n.usage.cpu_pct, mu = n.usage.mem_pct;
    return `<div class="card">
      <div class="top">
        <span class="name">${n.name}</span>
        <span>
          ${n.role === 'master' ? '<span class="badge b-master">master</span> ' : ''}
          <span class="badge ${n.ready ? 'b-ok' : 'b-bad'}">${n.ready ? 'Ready' : 'NotReady'}</span>
        </span>
      </div>
      <div class="kv"><span>地址</span><b class="mono">${n.ip}</b></div>
      <div class="kv"><span>CPU</span><b>${n.cpu} 核${cu ? ' · ' + cu + '%' : ''}</b></div>
      ${cu ? `<div class="bar"><i style="width:${pct(cu)}%"></i></div>` : ''}
      <div class="kv"><span>内存</span><b>${n.mem_gb} GB${mu ? ' · ' + mu + '%' : ''}</b></div>
      ${mu ? `<div class="bar"><i style="width:${pct(mu)}%"></i></div>` : ''}
      <div class="kv"><span>GPU</span><b>${n.gpu_count} × ${n.gpu_model || '—'}</b></div>
      ${n.taints.length ? `<div class="kv"><span>污点</span><b style="color:var(--warn)">${n.taints.join(', ')}</b></div>` : ''}
    </div>`;
  }).join('');
}

async function loadStorage() {
  const s = await api('/api/storage');
  document.getElementById('storage').textContent =
    s.error ? '' : `· 共享存储 ${s.free_gb}GB 可用 / ${s.total_gb}GB`;
}

async function loadJobs() {
  const d = await api('/api/jobs');
  const box = document.getElementById('jobs');
  const js = d.jobs || [];
  if (!js.length) { box.innerHTML = '<div class="empty">暂无任务</div>'; return; }
  box.innerHTML = `<table>
    <tr><th>任务</th><th>进度</th><th>分片分布</th><th>参数</th><th></th></tr>
    ${js.map(j => `<tr>
      <td><b class="mono">${j.name}</b><div class="sub" style="font-size:11px">${j.created.replace('T',' ').replace('Z','')}</div></td>
      <td>成功 ${j.succeeded}/${j.completions}${j.active ? ` · 运行 ${j.active}` : ''}${j.failed ? ` · <span style="color:var(--bad)">失败 ${j.failed}</span>` : ''}
        <div class="bar" style="margin-top:5px"><i style="width:${100 * j.succeeded / Math.max(1, j.completions)}%"></i></div></td>
      <td><div class="pods">${j.pods.map(p => `<span class="pod ${p.phase === 'Running' ? 'run' : p.phase === 'Succeeded' ? 'done' : p.phase === 'Failed' ? 'fail' : ''}">${p.node}</span>`).join('') || '—'}</div></td>
      <td class="mono" style="font-size:11px;max-width:260px;word-break:break-all">${j.options || '—'}</td>
      <td style="white-space:nowrap">
        <button class="ghost" onclick="showLogs('${j.name}')">日志</button>
        <button class="ghost" onclick="delJob('${j.name}')">删除</button>
      </td>
    </tr>`).join('')}
  </table>`;
}

async function showLogs(name) {
  currentLog = name;
  document.getElementById('logsec').style.display = 'block';
  document.getElementById('logname').textContent = name;
  const d = await api('/api/logs?job=' + encodeURIComponent(name));
  document.getElementById('logs').textContent = d.logs || '（无输出）';
}

function flash(ok, text) {
  const m = document.getElementById('msg');
  m.className = 'msg ' + (ok ? 'ok' : 'err');
  m.textContent = text;
  setTimeout(() => { m.className = 'msg'; }, 6000);
}

function toggleMode() {
  const local = document.getElementById('mode').value === 'local';
  document.getElementById('sharedFields').style.display = local ? 'none' : '';
  document.getElementById('localHint').style.display = local ? '' : 'none';
}

async function submitJob(e) {
  e.preventDefault();
  const mode = document.getElementById('mode').value;
  const body = {
    mode: mode,
    input: document.getElementById('input').value.trim(),
    output: document.getElementById('output').value.trim(),
    shards: document.getElementById('shards').value.trim(),
    options: document.getElementById('options').value.trim(),
  };
  const r = await api('/api/submit', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  flash(r.ok, r.msg);
  loadJobs();
}

async function delJob(name) {
  if (!confirm(`确认删除任务 ${name}？正在运行的分片会被终止。`)) return;
  const r = await api('/api/delete', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({job: name})
  });
  flash(r.ok, r.msg);
  loadJobs();
}

function refreshAll() {
  loadNodes(); loadJobs(); loadStorage();
  if (currentLog) showLogs(currentLog);
}

toggleMode();
refreshAll();
setInterval(() => { loadNodes(); loadJobs(); }, 8000);
setInterval(() => { if (currentLog) showLogs(currentLog); }, 12000);
</script>
</body>
</html>
